<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cube Follows Cursor</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
        }

        #gameArea {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #cube {
            width: 50px;
            height: 50px;
            border: 2px solid #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            background-image: url('assets/character_non_fireing.png');
            background-size: cover;
        }

        .projectile {
            position: absolute;
            width: 10px;
            height: 10px;
            background: yellow;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .enemy {
            transition: left 0.05s linear, top 0.05s linear;
        }

        .enemy.hit {
            animation: blink 0.2s linear 2;
        }

        @keyframes blink {
            0% {
                filter: brightness(2);
            }

            50% {
                filter: brightness(0.5);
            }

            100% {
                filter: brightness(2);
            }
        }
    </style>
</head>

<body>
    <div id="gameArea" style="position:relative;width:100vw;height:100vh;overflow:hidden;">
        <canvas id="gameCanvas"></canvas>
        <div id="cube"></div>
    </div>
    <div id="playerBars" style="position:absolute;top:10px;left:10px;z-index:100;">
        <div style="margin-bottom:4px;">
            <div style="color:white;font-size:14px;">Vie</div>
            <div id="hpBarBg" style="width:160px;height:18px;background:#222;border-radius:6px;overflow:hidden;">
                <div id="hpBar" style="height:100%;background:#e74c3c;width:100%;transition:width 0.2s;"></div>
            </div>
        </div>
        <div>
            <div style="color:white;font-size:14px;">Endurance</div>
            <div id="staminaBarBg" style="width:160px;height:12px;background:#222;border-radius:6px;overflow:hidden;">
                <div id="staminaBar" style="height:100%;background:#27ae60;width:100%;transition:width 0.2s;"></div>
            </div>
        </div>
    </div>
    <div id="ath" style="position:fixed;bottom:20px;left:20px;color:white;font-family:sans-serif;z-index:100;">
        <img id="weaponImg" src="" alt="Weapon" style="width:48px;height:48px;vertical-align:middle;">
        <span id="ammoDisplay" style="font-size:2em;margin-left:10px;"></span>
    </div>
    <script src="js/enemies.js"></script>
    <script src="js/env.js" defer></script>

    <script src="js/weapon.js" defer></script>
    <script src="js/player.js" defer></script>
</body>

</html>
